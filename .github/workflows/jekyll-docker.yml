name: Build Little Ghostreach Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Vite project dependencies
        run: npm install

      - name: Build offline web bundle into dist/
        run: npm run build

      - name: Verify dist/ and sprites/ exist
        run: |
          test -f dist/index.html
          ls -la dist/sprites || true

      - name: Create Cordova wrapper and copy dist/
        run: |
          npm install -g cordova
          rm -rf cordova-app
          cordova create cordova-app com.mzmdagosh.littleghostreach "Little Ghostreach"
          node -e '
            const fs = require("fs");
            const p = "cordova-app/config.xml";
            let xml = fs.readFileSync(p, "utf8");
            xml = xml.replace(
              "</widget>",
              "  <preference name=\"Orientation\" value=\"landscape\" />\n  <preference name=\"Fullscreen\" value=\"true\" />\n  <preference name=\"DisallowOverscroll\" value=\"true\" />\n</widget>"
            );
            fs.writeFileSync(p, xml, "utf8");
          '
          rm -rf cordova-app/www/*
          cp -r dist/* cordova-app/www/

      - name: Add Android platform and build Debug APK
        working-directory: cordova-app
        run: |
          cordova platform add android
          cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Little-Ghostreach-debug-apk
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
