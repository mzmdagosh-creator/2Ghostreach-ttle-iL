name: Build Little Ghostreach Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Vite project dependencies
        run: npm ci

      - name: Build offline web bundle into dist/
        run: npm run build

      - name: Verify dist/ and sprites/ exist
        run: |
          test -f dist/index.html
          ls -la dist/sprites || true

      - name: Initialize Cordova wrapper if not already present
        run: |
          if [ ! -f config.xml ]; then
            npx --yes cordova create cordova-app com.mzmdagosh.littleghostreach "Little Ghostreach"
            cp -r cordova-app/* .
            rm -rf cordova-app
          fi
          npm install --no-save cordova-android

      - name: Configure landscape lock, offline access & copy dist/ to www/
        run: |
          node -e '
            const fs = require("fs");
            let xml = fs.readFileSync("config.xml", "utf8");
            if (!xml.includes("Orientation")) {
              xml = xml.replace(
                "</widget>",
                "  <preference name=\"Orientation\" value=\"landscape\" />\n  <preference name=\"Fullscreen\" value=\"true\" />\n  <preference name=\"DisallowOverscroll\" value=\"true\" />\n  <access origin=\"*\" />\n</widget>"
              );
              fs.writeFileSync("config.xml", xml, "utf8");
            }
          '
          rm -rf www/*
          mkdir -p www
          cp -r dist/* www/

      - name: Ensure Android platform is added
        run: |
          if [ ! -d platforms/android ]; then
            npx cordova platform add android --no-fetch
          fi

      - name: Build Debug APK
        run: npx cordova build android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Little-Ghostreach-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
